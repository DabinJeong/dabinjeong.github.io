      Thesis: *Computational modeling of molecular interactions for biomarker
      discovery using single/multi-omics data*. Published 3 first-authored and
      10 co-authored papers. Developed GOAT, a graph neural network for
      multi-omics biomarker discovery in eosinophilic asthma, and RNA-seq
