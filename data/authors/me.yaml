experience:
  - role: Senior Data Scientist
    org: Wellcome Sanger Institute (Lotfollahi Lab)
    start: 2024-10-01
    summary: |
      Led **SIGMMA**, a hierarchical contrastive learning framework that aligns
      H&E histopathology with spatial transcriptomics (ICML 2026 FM4LS/SD4H
      workshop; journal version in preparation). Led **LocoGen**, a generative
      framework for de novo regulatory DNA design that uses property-guided
      generation for out-of-distribution objectives in a lab-in-the-loop cycle
      (NeurIPS 2026).
  - role: Research Intern
    org: LG AI Research
    start: 2024-01-01
    end: 2024-04-30
    summary: |
      Contributed to EXAONEPath, a self-supervised foundation model for H&E
      histopathology images. Built a scalable, reproducible multi-omics
      preprocessing pipeline.

